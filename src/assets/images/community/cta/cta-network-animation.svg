<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="networkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="20" fill="url(#networkGradient)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="300" cy="100" r="20" fill="url(#networkGradient)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="200" cy="200" r="20" fill="url(#networkGradient)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="100" cy="300" r="20" fill="url(#networkGradient)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="300" cy="300" r="20" fill="url(#networkGradient)">
    <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <line x1="100" y1="100" x2="200" y2="200" stroke="url(#networkGradient)" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="300" y1="100" x2="200" y2="200" stroke="url(#networkGradient)" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <line x1="200" y1="200" x2="100" y2="300" stroke="url(#networkGradient)" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </line>
  <line x1="200" y1="200" x2="300" y2="300" stroke="url(#networkGradient)" stroke-width="2" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </line>
</svg>
